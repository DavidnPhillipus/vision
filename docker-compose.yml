# Optional local Postgres only. Production / shared team DB is Supabase
# (set DATABASE_URL in backend/.env to the Supabase session pooler).
# You can leave this stopped when using Supabase:
#   docker compose stop db
services:
  db:
    image: postgres:16-alpine
    container_name: vision_db
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
      POSTGRES_DB: vision
    ports:
      - "5433:5432"
    volumes:
      - vision_pgdata:/var/lib/postgresql/data

volumes:
  vision_pgdata:
