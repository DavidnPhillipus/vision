# Blueprint: https://dashboard.render.com → New → Blueprint
# Docker pins Python 3.12 (native "Python 3" on Render may default to 3.14).
services:
  - type: web
    name: vision-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        value: gemini-3.1-flash-lite
      - key: OPENAI_VISION_MODEL
        value: gemini-3.1-flash-lite
      - key: UPLOAD_DIR
        value: uploads
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
